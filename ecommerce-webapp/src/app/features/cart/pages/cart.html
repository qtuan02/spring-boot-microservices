<section class="p-4">
  <div appLayoutContent>
    <app-back-button class="mb-4">Continue Shopping</app-back-button>

    <h1 class="text-2xl font-bold mb-4">Shopping Cart</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2">
        <app-list-cart />
      </div>

      <div>
        <app-summarize-order>
          <div class="flex mt-6">
            <button matButton="filled" class="group flex-1" (click)="handleCheckout()">
              Checkout
            </button>
          </div>
        </app-summarize-order>
      </div>
    </div>
  </div>
</section>
