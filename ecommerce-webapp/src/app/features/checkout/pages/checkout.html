@if (orderResource.orderNumber()) {
  <app-order-success />
} @else {
  <section class="p-4">
    <div appLayoutContent>
      <app-back-button class="mb-4">Back to Cart</app-back-button>

      <h1 class="text-2xl font-bold mb-4">Checkout</h1>

      <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
        <div class="lg:col-span-3 flex flex-col gap-6">
          <app-customer-form>
            <mat-form-field appearance="outline">
              <mat-label>Comments</mat-label>
              <textarea
                matInput
                [formControl]="comments"
                placeholder="e.g. Giao hàng giờ hành chính"
              ></textarea>
            </mat-form-field>
          </app-customer-form>
          <app-shipping-form></app-shipping-form>
        </div>

        <div class="lg:col-span-2">
          <app-summarize-order>
            <ng-container checkoutItems>
              @for (item of cartStore.items(); track item.product.code) {
                <div class="text-sm flex justify-between">
                  <span>{{ item.product.name }}</span>
                  <span>$ {{ (item.product.price * item.quantity).toFixed(2) }}</span>
                </div>
              }
            </ng-container>
            <div class="flex mt-6">
              <button
                matButton="filled"
                class="group flex-1"
                (click)="handlePlaceOrder()"
                [disabled]="orderResource.isLoading()"
              >
                @if (orderResource.isLoading()) {
                  Placing Order...
                } @else {
                  Place Order
                }
              </button>
            </div>
          </app-summarize-order>
        </div>
      </div>
    </div>
  </section>
}
