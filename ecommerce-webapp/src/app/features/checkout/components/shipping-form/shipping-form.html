<div appLayoutCard>
  <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
    <mat-icon>local_shipping</mat-icon>
    Shipping Information
  </h2>

  <form [formGroup]="form" class="grid grid-cols-1 lg:grid-cols-2 gap-x-4 gap-y-1">
    <mat-form-field appearance="outline" class="col-span-2">
      <mat-label>Address 1</mat-label>
      <input matInput type="text" formControlName="addressLine1" />
      <mat-error>Address 1 is required</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="col-span-2">
      <mat-label>Address 2</mat-label>
      <input matInput type="text" formControlName="addressLine2" />
      <mat-error>Address 2 is required</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>City</mat-label>
      <input matInput type="text" formControlName="city" />
      <mat-error>City is required</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>State</mat-label>
      <input matInput type="text" formControlName="state" />
      <mat-error>State is required</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Country</mat-label>
      <input matInput type="text" formControlName="country" />
      <mat-error>Country is required</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Zip Code</mat-label>
      <input matInput type="text" formControlName="zipCode" />
      <mat-error>Zip Code is required</mat-error>
    </mat-form-field>
  </form>
</div>
