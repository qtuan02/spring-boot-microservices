<mat-toolbar class="w-full elevated sticky top-0 z-50">
  <div class="max-w-[1200px] mx-auto w-full items-center flex justify-between">
    <h1 class="text-xl font-bold select-none hover:cursor-pointer" [routerLink]="ROOT_PATHS.home">
      E-Commerce
    </h1>

    <div class="flex items-center gap-2">
      <button
        matIconButton
        [routerLink]="CART_PATHS.cart"
        [matBadge]="cartStore.count()"
        [matBadgeHidden]="cartStore.count() === 0"
      >
        <mat-icon>shopping_cart</mat-icon>
      </button>

      @if (authService.isLoggedIn()) {
        <div class="flex items-center gap-0">
          <button matButton class="!font-medium" [routerLink]="PROFILE_PATHS.profile">
            Hi, {{ authService.username() }}
          </button>
          <button matIconButton class="!text-red-500" (click)="logout()">
            <mat-icon>logout</mat-icon>
          </button>
        </div>
      } @else {
        <button matButton (click)="authService.login()">Sign In</button>
        <button matButton="filled" (click)="authService.login()">Sign Up</button>
      }
    </div>
  </div>
</mat-toolbar>
