<div
  class="group bg-white cursor-pointer rounded-xl shadow-lg overflow-hidden flex flex-col h-full transition-all duration-200 ease-out hover:-translate-y-1 hover:shadow-xl"
>
  <div class="relative h-[300px] overflow-hidden">
    <img [src]="product().imageUrl" class="w-full h-full object-fill rounded-t-xl" />

    <button
      matButton="filled"
      class="absolute! bottom-0 inset-x-0 gap-2 bg-blue-500! rounded-b-none! translate-y-full group-hover:translate-y-0 transition-transform! duration-200 ease-out"
      (click)="handleAddToCart.emit(product())"
    >
      <mat-icon>shopping_cart</mat-icon>
      Add to Cart
    </button>
  </div>

  <div class="p-3 flex flex-col flex-1 justify-between">
    <h3 class="text-base font-semibold text-gray-700 mb-2 leading-tight h-10 line-clamp-2">
      {{ product().name }}
    </h3>

    <div class="flex items-end justify-between">
      <span class="text-lg font-bold text-blue-700">${{ product().price }}</span>
      <div class="text-xs font-medium text-green-700">In Stock</div>
    </div>
  </div>
</div>
