<div class="max-w-[200px] p-1.25">
  <div
    class="group bg-white cursor-pointer rounded-xl shadow-sm overflow-hidden flex flex-col h-full transition-all duration-200 ease-out hover:-translate-y-1 hover:shadow-md"
    [routerLink]="[PRODUCT_PATHS.product, generateSlugFn(product().name, product().code)]"
  >
    <div class="relative h-[250px] overflow-hidden">
      <img
        [src]="product().imageUrl"
        class="w-full h-full object-fill rounded-t-xl"
        [style.view-transition-name]="'product-image-' + product().code"
      />

      <button
        matButton="filled"
        class="absolute! bottom-0 inset-x-0 gap-2 bg-blue-500! rounded-b-none! translate-y-full group-hover:translate-y-0 transition-transform! duration-200 ease-out"
        (click)="handleAddToCart($event)"
      >
        <mat-icon>shopping_cart</mat-icon>
        Add to Cart
      </button>
    </div>

    <div class="p-2 flex flex-col flex-1 justify-between">
      <h3 class="text-sm font-medium text-gray-700 mb-1 leading-tight h-9 line-clamp-2">
        {{ product().name }}
      </h3>

      <div class="flex items-end justify-between">
        <span class="text-base font-bold text-blue-700">${{ product().price }}</span>
        <div class="text-[10px] font-medium text-green-700">In Stock</div>
      </div>
    </div>
  </div>
</div>
