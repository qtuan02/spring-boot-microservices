<div class="flex items-center gap-3">
  <div class="inline-flex items-center">
    <button matIconButton [disabled]="quantity() < 1" (click)="quantityChange.emit(quantity() - 1)">
      <mat-icon>remove</mat-icon>
    </button>
    <div class="px-3 select-none">{{ quantity() }}</div>
    <button matIconButton (click)="quantityChange.emit(quantity() + 1)">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>
